[project]
name = "gnn-fraud"
version = "0.1.0"
description = "GraphSAGE for fraud detection, from scratch in pure Python"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Rishabh Pande"}]
license = {text = "MIT"}

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["gnn_fraud*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
